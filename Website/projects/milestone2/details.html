<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Book Details | Open Library API
  </title>
  <link href="styles.css" rel="stylesheet"/>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js">
  </script>
 </head>
 <body>
  <main class="shell">
   <header>
    <a class="brand" href="index.html">
     Open Library Explorer
    </a>
    <nav aria-label="Main navigation">
     <a href="index.html">
      Home
     </a>
     <a href="bookshelf.html">
      My Bookshelf
     </a>
    </nav>
   </header>
   <p>
    <a href="index.html">
     ← Back to search
    </a>
   </p>
   <section class="panel">
    <div class="status" id="status" role="status">
     Loading book details…
    </div>
    <div id="details">
    </div>
   </section>
   <footer>
    Book data provided by
    <a href="https://openlibrary.org/" rel="noopener" target="_blank">
     Open Library
    </a>
    .
   </footer>
  </main>
  <script>
   $(function(){const params=new URLSearchParams(location.search);let workId=(params.get('workId')||'').trim();if(!/^OL\d+W$/.test(workId)){ $('#status').addClass('error').text('A valid Work ID was not provided. Return to Home and select a book.');return;}const $status=$('#status');$.ajax({url:'https://openlibrary.org/works/'+encodeURIComponent(workId)+'.json',dataType:'json',timeout:15000}).done(book=>{$status.hide();const title=book.title||'Untitled';const $layout=$('<div class="details-layout">');const cover=Array.isArray(book.covers)?book.covers.find(id=>Number(id)>0):null;if(cover){$layout.append($('<img class="details-cover">').attr({src:'https://covers.openlibrary.org/b/id/'+encodeURIComponent(cover)+'-M.jpg?default=false',alt:'Cover of '+title}).on('error',function(){$(this).replaceWith($('<div class="empty-cover">').text('Cover not available'));}));}else{$layout.append($('<div class="empty-cover">').text('Cover not available'));}const $content=$('<div>');$content.append($('<h1 class="book-title">').text(title));$content.append($('<p>').append($('<strong>').text('Work ID: '),document.createTextNode(workId)));let description=book.description;if(description&&typeof description==='object')description=description.value;if(typeof description==='string'&&description.trim())$content.append($('<h2>').text('Description'),$('<p>').text(description));else $content.append($('<p class="muted">').text('Description not available.'));const subjects=Array.isArray(book.subjects)?book.subjects.slice(0,10):[];$content.append($('<h2>').text('Subjects'));if(subjects.length){const $ul=$('<ul class="subjects">');subjects.forEach(s=>$ul.append($('<li>').text(s)));$content.append($ul);}else{$content.append($('<p class="muted">').text('Subjects not available.'));}$content.append($('<p>').append($('<a target="_blank" rel="noopener">').attr('href','https://openlibrary.org/works/'+encodeURIComponent(workId)).text('View this work on Open Library')));$layout.append($content);$('#details').append($layout);}).fail(()=>{$status.addClass('error').text('Unable to retrieve this book. Please return to Home and try another result.');});});
  </script>
 </body>
</html>
