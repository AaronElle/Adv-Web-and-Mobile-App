<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookshelf | Open Library API</title><link rel="stylesheet" href="styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><main class="shell"><header><a class="brand" href="index.html">Open Library Explorer</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="bookshelf.html" aria-current="page">My Bookshelf</a></nav></header><section class="intro"><p class="muted">Personal collection</p><h1>My Bookshelf</h1><p>A small selection of books loaded from Open Library using their Work IDs.</p></section><section class="panel"><div id="status" class="status" role="status">Loading your bookshelf…</div><div id="bookshelf" class="results"></div></section><footer>Book data provided by <a href="https://openlibrary.org/" target="_blank" rel="noopener">Open Library</a>.</footer></main><script>
$(function(){const workIds=['OL17422847W','OL45804W','OL27448W','OL262758W'];let completed=0,failed=0;const $out=$('#bookshelf'),$status=$('#status');function cover(id,title){if(!id){return $('<div class="empty-cover">').text('Cover not available');}return $('<img>').attr({src:'https://covers.openlibrary.org/b/id/'+encodeURIComponent(id)+'-S.jpg?default=false',alt:'Cover of '+title,loading:'lazy'}).on('error',function(){$(this).replaceWith($('<div class="empty-cover">').text('Cover not available'));});}workIds.forEach(id=>{$.ajax({url:'https://openlibrary.org/works/'+encodeURIComponent(id)+'.json',dataType:'json',timeout:15000}).done(book=>{const title=book.title||'Untitled';const $card=$('<article class="book">').append(cover(Array.isArray(book.covers)?book.covers.find(c=>Number(c)>0):null,title));$card.append($('<h3>').append($('<a>').attr('href','details.html?workId='+encodeURIComponent(id)).text(title)));$card.append($('<p class="muted">').text('Work ID: '+id));$out.append($card);}).fail(()=>{failed++;}).always(()=>{completed++;if(completed===workIds.length){if($out.children().length)$status.text(failed?'Bookshelf loaded. '+failed+' book(s) could not be retrieved.':'Your bookshelf is ready.');else $status.addClass('error').text('Unable to load your bookshelf. Please check your connection and refresh.');}});});});
</script></body></html>
