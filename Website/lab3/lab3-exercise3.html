<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lab 3 - Exercise 3</title><link rel="stylesheet" href="../styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><main class="lab-page"><h1>Lab 3: JSON</h1><h2>Exercise 3: Read JSON Values</h2><div id="firstBook"></div><h3>All Books</h3><div id="bookList"></div><p id="bookCount"></p><p><a class="button" href="../labs.html">Back to Labs</a></p></main><script>const data={books:[{title:'Web Development Basics',author:'Maya Lee',price:29.99},{title:'Modern JavaScript',author:'Daniel Kim',price:34.50},{title:'Understanding JSON',author:'Sofia Patel',price:24.95}]};$(function(){const first=data.books[0];$('#firstBook').html('<div class="json-card"><h3>First Book</h3><p><strong>Title:</strong> '+first.title+'</p><p><strong>Author:</strong> '+first.author+'</p><p><strong>Price:</strong> $'+first.price.toFixed(2)+'</p></div>');$.each(data.books,function(i,book){$('#bookList').append('<div class="json-card"><strong>'+book.title+'</strong> by '+book.author+' — $'+book.price.toFixed(2)+'</div>')});$('#bookCount').text('Total number of books: '+data.books.length);});</script></body></html>
