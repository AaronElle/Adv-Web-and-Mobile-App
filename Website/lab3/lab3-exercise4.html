<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lab 3 - Exercise 4</title><link rel="stylesheet" href="../styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><main class="lab-page"><h1>Lab 3: JSON</h1><h2>Exercise 4: Work with Nested JSON Data</h2><div id="student"></div><h3>Courses</h3><div id="courses"></div><p><a class="button" href="../labs.html">Back to Labs</a></p></main><script>const student={name:'Aaron Elle',major:'Information Technology',email:'aaron@example.com',courses:[{code:'ITEC 3100',title:'Web Development',credits:3},{code:'ITEC 3200',title:'Database Systems',credits:3},{code:'ITEC 3300',title:'Information Security',credits:3}]};$(function(){$('#student').html('<div class="json-card"><p><strong>Student:</strong> '+student.name+'</p><p><strong>Major:</strong> '+student.major+'</p><p><strong>Email:</strong> '+student.email+'</p></div>');$.each(student.courses,function(i,course){$('#courses').append('<div class="json-card"><p><strong>Code:</strong> '+course.code+'</p><p><strong>Title:</strong> '+course.title+'</p><p><strong>Credit Hours:</strong> '+course.credits+'</p></div>')});});</script></body></html>
