<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lab 3 - Exercise 5</title><link rel="stylesheet" href="../styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><main class="lab-page"><h1>Lab 3: JSON</h1><h2>Exercise 5: Read and Display JSON from a File</h2><p>This page retrieves <code>weather.json</code> and displays selected values instead of the raw JSON.</p><div id="weather"></div><p id="weatherError" class="error"></p><p><a class="button" href="../labs.html">Back to Labs</a></p></main><script>$(function(){$.getJSON('weather.json').done(function(w){const loc=w.location||{};const temp=w.temperature||{};const wind=w.wind||{};$('#weather').html('<div class="json-card"><h3>'+((loc.city||'')+', '+(loc.state||''))+'</h3><p><strong>Temperature:</strong> '+(temp.value??w.temperature)+'°'+(temp.unit||'F')+'</p><p><strong>Conditions:</strong> '+(w.conditions||w.weather||'N/A')+'</p><p><strong>Humidity:</strong> '+(w.humidity??'N/A')+'%</p><p><strong>Wind:</strong> '+(wind.speed??'N/A')+' '+(wind.unit||'')+' '+(wind.direction||'')+'</p></div>')}).fail(function(){$('#weatherError').text('Unable to read weather.json. Make sure the JSON file is in the same folder and the site is being viewed through a web server.');});});</script></body></html>
