<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lab 3 - Exercise 6</title><link rel="stylesheet" href="../styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><main class="lab-page"><h1>Lab 3: JSON</h1><h2>Exercise 6: Movie Information Page</h2><p>This page retrieves <code>movie.json</code> and organizes its values into a movie information page.</p><div id="movie"></div><p id="movieError" class="error"></p><p><a class="button" href="../labs.html">Back to Labs</a></p></main><script>$(function(){$.getJSON('movie.json').done(function(m){let genres=(m.genres||[]).join(', ');let cast='';$.each(m.cast||[],function(i,c){cast+='<li>'+c.name+' as '+c.character+'</li>'});$('#movie').html('<div class="json-card"><h3>'+m.title+'</h3><p><strong>Release:</strong> '+(m.release?.date||m.release?.year||'N/A')+'</p><p><strong>Overview:</strong> '+(m.overview||m.description||'N/A')+'</p><p><strong>Genres:</strong> '+genres+'</p><p><strong>Rating:</strong> '+(m.rating?.score||m.rating||'N/A')+'</p><h4>Cast</h4><ul>'+cast+'</ul></div>')}).fail(function(){$('#movieError').text('Unable to read movie.json. Make sure the JSON file is in the same folder and the site is being viewed through a web server.');});});</script></body></html>
