<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Lab 4 - RESTful Web APIs
  </title>
  <link href="../styles.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="lab-page">
   <h1>
    Lab 4: RESTful Web APIs
   </h1>
   <h2>
    Page 1: User and Albums
   </h2>
   <p>
    This page retrieves a user and that user's albums from the live JSONPlaceholder API.
   </p>
   <p>
    <a href="../labs.html">
     Back to Labs
    </a>
   </p>
   <div class="json-card" id="user">
    Loading user information...
   </div>
   <h2>
    Albums
   </h2>
   <p>
    Select an album title to view its photos.
   </p>
   <div class="json-card" id="albums">
    Loading albums...
   </div>
   <p class="error" id="message">
   </p>
  </main>
  <script>
   fetch('https://jsonplaceholder.typicode.com/users/1')
    .then(response => {
        if (!response.ok) throw new Error('Could not retrieve the user.');
        return response.json();
    })
    .then(user => {
        document.getElementById('user').innerHTML = `
            <h3>${user.name}</h3>
            <p><strong>Username:</strong> ${user.username}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            <p><strong>Address:</strong> ${user.address.street}, ${user.address.suite}, ${user.address.city}, ${user.address.zipcode}</p>
            <p><strong>Phone:</strong> ${user.phone}</p>
            <p><strong>Website:</strong> ${user.website}</p>
            <p><strong>Company:</strong> ${user.company.name}</p>`;
    })
    .catch(error => document.getElementById('message').textContent = error.message);

fetch('https://jsonplaceholder.typicode.com/albums?userId=1')
    .then(response => {
        if (!response.ok) throw new Error('Could not retrieve the albums.');
        return response.json();
    })
    .then(albums => {
        const list = document.createElement('ol');
        albums.forEach(album => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = `album.html?albumId=${album.id}`;
            link.textContent = album.title;
            item.appendChild(link);
            list.appendChild(item);
        });
        const container = document.getElementById('albums');
        container.textContent = '';
        container.appendChild(list);
    })
    .catch(error => document.getElementById('message').textContent = error.message);
  </script>
 </body>
</html>
