<h2>Exercise 7: Picture Browser Application</h2>

<div class="lab2-card">
<p class="counter" id="counter"></p>
<img id="browserImage" class="browser-img" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80" alt="Mountain landscape">
<p class="caption" id="caption">Mountain Landscape</p>
<div class="lab2-button-row">
<button class="lab2-btn" id="prev">Previous</button>
<button class="lab2-btn" id="next">Next</button>
</div>
</div>
<script>
$(document).ready(function(){
 const pictures=[
  {url:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80",caption:"Mountain Landscape"},
  {url:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80",caption:"Lake and Mountains"},
  {url:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80",caption:"Forest Valley"},
  {url:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80",caption:"Snowy Mountains"},
  {url:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80",caption:"Forest"}
 ];
 let index=0;
 function showPicture(){
   $("#browserImage").stop(true,true).fadeOut(250,function(){
     $(this).attr("src",pictures[index].url).attr("alt",pictures[index].caption).fadeIn(350);
   });
   $("#caption").text(pictures[index].caption);
   $("#counter").text("Picture "+(index+1)+" of "+pictures.length);
 }
 $("#next").click(function(){ index=(index+1)%pictures.length; showPicture(); });
 $("#prev").click(function(){ index=(index-1+pictures.length)%pictures.length; showPicture(); });
 $(document).keydown(function(e){
   if(e.key==="ArrowRight"){ index=(index+1)%pictures.length; showPicture(); }
   if(e.key==="ArrowLeft"){ index=(index-1+pictures.length)%pictures.length; showPicture(); }
 });
 $("#browserImage").on("error",function(){ $("#caption").text("Unable to load this image."); });
 showPicture();
});
</script>
