   <h2>
    Exercise 5: jQuery Visual Effects
   </h2>
   <div class="lab2-card">
    <div class="effect-box" id="effectBox">
     jQuery Visual Effects
    </div>
    <div class="lab2-button-row">
     <button class="lab2-btn" id="hideEffect">
      Hide
     </button>
     <button class="lab2-btn" id="showEffect">
      Show
     </button>
     <button class="lab2-btn" id="toggleEffect">
      Toggle
     </button>
     <button class="lab2-btn" id="fadeEffect">
      Fade
     </button>
     <button class="lab2-btn" id="slideEffect">
      Slide
     </button>
    </div>
   </div>
   <script>
    $(document).ready(function(){
 $("#hideEffect").click(function(){ $("#effectBox").hide(); });
 $("#showEffect").click(function(){ $("#effectBox").show(); });
 $("#toggleEffect").click(function(){ $("#effectBox").toggle(); });
 $("#fadeEffect").click(function(){ $("#effectBox").fadeToggle(700); });
 $("#slideEffect").click(function(){ $("#effectBox").slideToggle(700); });
});
   </script>
